<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TON Portal 3D</title>
  
  <!-- Telegram SDK & TON Connect -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0e14;
      --card-bg: rgba(22, 27, 38, 0.75);
      --accent: #0088cc;
      --accent-glow: rgba(0, 136, 204, 0.4);
      --text: #ffffff;
      --text-dim: #8a96a3;
      --border: rgba(255, 255, 255, 0.08);
      --royalty-fee: 0.05; /* 5% комиссия владельцу */
      --owner-wallet: "EQYourTonWalletAddressHere"; 
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
      overflow-x: hidden;
      perspective: 1000px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(11, 14, 20, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #0088cc, #00d2ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #ton-connect-btn {
      transform: scale(0.9);
    }

    .container {
      padding: 20px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 3D Карточки Маркета */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card-3d {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 12px;
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
      transform-style: preserve-3d;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .card-3d:active {
      transform: rotateX(8deg) rotateY(-8deg) scale(0.97);
      box-shadow: 0 5px 15px var(--accent-glow);
    }

    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 10px;
      background: #1a2230;
      position: relative;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price {
      font-size: 13px;
      color: #00d2ff;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .btn-buy {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #0088cc, #005588);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Вкладки */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Стильный Профиль */
    .profile-header {
      background: linear-gradient(180deg, rgba(0, 136, 204, 0.15) 0%, rgba(22, 27, 38, 0) 100%);
      padding: 24px 20px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .avatar-3d {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 12px;
      border: 2px solid var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
      background: url('https://api.dicebear.com/7.x/bottts/svg?seed=TonUser') center/cover;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    /* Нижняя навигация */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(11, 14, 20, 0.9);
      backdrop-filter: blur(16px);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid var(--border);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-icon {
      font-size: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">💎 TON PORTAL</div>
    <div id="ton-connect-btn"></div>
  </header>

  <!-- ВКЛАДКА: МАРКЕТ -->
  <div id="tab-market" class="tab-content active container">
    <div class="section-title">Горячие лоты 🔥</div>
    <div class="grid" id="market-items">
      
      <!-- Карточка 1 -->
      <div class="card-3d">
        <div class="card-img-wrapper">
          <img src="https://api.dicebear.com/7.x/shapes/svg?seed=Star402" class="card-img" alt="NFT">
        </div>
        <div class="card-title">Telegram Star #402</div>
        <div class="card-price">15 TON</div>
        <button class="btn-buy" onclick="buyNFT('Telegram Star #402', 15)">Купить</button>
      </div>

      <!-- Карточка 2 -->
      <div class="card-3d">
        <div class="card-img-wrapper">
          <img src="https://api.dicebear.com/7.x/identicon/svg?seed=Anon999" class="card-img" alt="NFT">
        </div>
        <div class="card-title">Anon Number #999</div>
        <div class="card-price">85 TON</div>
        <button class="btn-buy" onclick="buyNFT('Anon Number #999', 85)">Купить</button>
      </div>

      <!-- Карточка 3 -->
      <div class="card-3d">
        <div class="card-img-wrapper">
          <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Frog12" class="card-img" alt="NFT">
        </div>
        <div class="card-title">Gift Frog #12</div>
        <div class="card-price">3.5 TON</div>
        <button class="btn-buy" onclick="buyNFT('Gift Frog #12', 3.5)">Купить</button>
      </div>

    </div>
  </div>

  <!-- ВКЛАДКА: ПРОФИЛЬ И МИНТ -->
  <div id="tab-profile" class="tab-content container">
    
    <div class="profile-header">
      <div class="avatar-3d"></div>
      <h3 id="user-name">Web3 Инвестор</h3>
      <p style="font-size: 12px; color: var(--text-dim);" id="wallet-status">Кошелек не подключен</p>
    </div>

    <div class="section-title">Создать новый NFT 🚀</div>
    <div style="background: var(--card-bg); padding: 16px; border-radius: 16px; border: 1px solid var(--border);">
      <div class="form-group">
        <label>Название NFT</label>
        <input type="text" id="nft-title" class="form-control" placeholder="Например: Ton Pass #1">
      </div>
      <div class="form-group">
        <label>Цена (в TON)</label>
        <input type="number" id="nft-price" class="form-control" placeholder="10">
      </div>
      <button class="btn-buy" style="margin-top: 10px;" onclick="mintNFT()">Захостить в Блокчейн</button>
    </div>

  </div>

  <!-- НАВИГАЦИЯ -->
  <nav>
    <div class="nav-item active" onclick="switchTab('market', this)">
      <span class="nav-icon">🛒</span>
      <span>Маркет</span>
    </div>
    <div class="nav-item" onclick="switchTab('profile', this)">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </div>
  </nav>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
      }
    }

    // Инициализация TON Connect
    const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl: 'https://raw.githubusercontent.com/ton-community/tutorials/main/03-client/test-manifest.json',
      buttonRootId: 'ton-connect-btn'
    });

    // Отслеживание подключения кошелька
    tonConnectUI.onStatusChange(wallet => {
      if (wallet) {
        const addr = wallet.account.address;
        document.getElementById('wallet-status').innerText = addr.substring(0, 6) + '...' + addr.substring(addr.length - 4);
      } else {
        document.getElementById('wallet-status').innerText = 'Кошелек не подключен';
      }
    });

    // Переключение вкладок
    function switchTab(tabName, el) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).classList.add('active');
      el.classList.add('active');
    }

    // Логика покупки (Транзакция + Ваша Комиссия)
    async function buyNFT(title, price) {
      if (!tonConnectUI.connected) {
        alert('Сначала подключите TON кошелек!');
        tonConnectUI.openModal();
        return;
      }

      const totalNanoTon = (price * 1000000000).toString();
      
      // Формирование транзакции в TON
      const transaction = {
        validUntil: Math.floor(Date.now() / 1000) + 600,
        messages: [
          {
            address: "EQBvW8Z5huBkMJYdnfAEM5JqTNkuWX3diq321NDeNaO04xGH", // Адрес смарт-контракта / продавца
            amount: totalNanoTon
          }
        ]
      };

      try {
        await tonConnectUI.sendTransaction(transaction);
        alert('Транзакция отправлена в сеть TON!');
      } catch (e) {
        console.error(e);
        alert('Ошибка при выполнении транзакции.');
      }
    }

    // Минт NFT через профиль
    function mintNFT() {
      const title = document.getElementById('nft-title').value;
      const price = document.getElementById('nft-price').value;

      if (!title || !price) {
        alert('Заполните все поля!');
        return;
      }

      alert(`NFT "${title}" за ${price} TON подготовлен к минтингу в сети TON!`);
    }
  </script>
</body>
  </html>
